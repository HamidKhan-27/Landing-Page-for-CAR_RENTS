<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rent A Car</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <img src="./images/Frame 993.png" alt="" />
        <ul>
          <li><a href="#"> Become a renter</a></li>
          <li><a href="#"> Rentals deals</a></li>
          <li><a href="#"> How it work</a></li>
          <li><a href="#"> Why choose us</a></li>
        </ul>
        <div>
          <button class="sign-in">Sign in</button>
          <button class="sign-up">Sign up</button>
        </div>
      </nav>

      <div class="hero">
        <div class="hero-left">
          <h1>Find, book and rent a car <span>Easily</span></h1>
          <p>
            Get a car wherever and whenever you need it with your IOS and
            Android device.
          </p>
          <div class="btns-container">
            <button class="android">
              <i class="fa-brands fa-google-play"></i>Google Play
            </button>
            <button class="apple">
              <i class="fa-brands fa-apple"></i>App Store
            </button>
          </div>
        </div>

        <div class="hero-right">
          <img src="./images/car 2 1.png" alt="" />
        </div>
      </div>

      <div class="hero-bottom">
        <div class="card">
          <i class="fa-solid fa-location-pin"></i>
          <div>
            <h4>Location</h4>
            <p>Search your location</p>
          </div>
        </div>

        <div class="card card-2">
          <i class="fa-solid fa-calendar-days"></i>
          <div>
            <h4>Pickup date</h4>
            <p>Tue 15 Feb, 09:00</p>
          </div>
        </div>

        <div class="card card-3">
          <i class="fa-solid fa-calendar-days"></i>
          <div>
            <h4>Return date</h4>
            <p>Thu 16 Feb, 11:00</p>
          </div>
        </div>

        <div class="card">
          <button class="search-btn">Search</button>
        </div>
      </div>
    </header>
  </body>
</html>
